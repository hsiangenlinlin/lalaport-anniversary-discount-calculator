<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lalaport台中折扣計算機4/1-4/?</title>
    <style>
        /* Body 背景 */
        body {
            background-color: #FFF7ED; /* 淺沙色 */
            padding: 2rem;
        }

        /* 卡片容器 */
        .card-container {
            background-color: #F5F5F5; /* 柔和米色 */
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 28rem;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .card-container {
                max-width: 42rem;
            }
        }

        /* 卡片內部填充 */
        .card-content {
            padding: 2rem;
        }

        /* 標題 */
        .title {
            color: #5C4033; /* 深棕色 */
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        /* 輸入框 */
        input[type="number"] {
            display: block;
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #D4A373; /* 淺棕色邊框 */
            border-radius: 0.375rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            margin-top: 0.25rem;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #8B5E3C; /* 棕色焦點邊框 */
            box-shadow: 0 0 0 3px rgba(139, 94, 60, 0.2); /* 焦點外框 */
        }

        /* 按鈕 */
        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            background-color: #8B5E3C; /* 溫暖棕色 */
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #6B4E31; /* 懸停時略深 */
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 0 2px #A67B5B; /* 焦點外框 */
        }

        /* 結果區域 */
        #result {
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="card-container">
        <div class="card-content">
            <div class="title">Lalaport台中折扣計算機4/1-4/?</div>
            <input type="number" id="originalPrice" placeholder="輸入原始價格" />
            <button onclick="calculateDiscount()">計算折扣</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        function calculateSavingsFromOriginalPrice(spend1, spend2) {
            // 第一筆消費：計算可獲得的折價券
            let voucher_500_count = Math.floor(spend1 / 10000); // 每滿10,000元獲得一張500元折價券
            let voucher_300_count = Math.floor(spend1 / 10000); // 每滿10,000元獲得一張300元折價券

            // 第二筆消費：計算可使用的折價券
            let actual_payment1 = spend1; // 第一筆無折扣
            let actual_payment2 = spend2;

            // 使用500元折價券（無限制）
            let total_500_discount = voucher_500_count * 500;
            actual_payment2 -= total_500_discount;

            // 使用300元折價券（每1,000元可使用一張）
            let max_300_vouchers_usable = Math.floor(spend2 / 1000);
            let vouchers_300_used = Math.min(voucher_300_count, max_300_vouchers_usable);
            let total_300_discount = vouchers_300_used * 300;
            actual_payment2 -= total_300_discount;

            // 總實際支付金額
            let total_actual_payment = actual_payment1 + actual_payment2;

            return {
                'Total actual payment': total_actual_payment,
                'Spend 1': spend1,
                'Spend 2': spend2,
                'Actual payment 1': actual_payment1,
                'Actual payment 2': actual_payment2,
                'Voucher 500 count': voucher_500_count,
                'Voucher 300 count': voucher_300_count,
                'Vouchers 300 used': vouchers_300_used
            };
        }

        function maximizeSavingsMinFinalSpending(original_price) {
            let best_total_actual_payment = Infinity;
            let best_split = [0, 0];
            let best_details = {};

            // 遍歷所有可能的分配
            for (let spend1 = 0; spend1 <= original_price; spend1++) {
                let spend2 = original_price - spend1;
                let result = calculateSavingsFromOriginalPrice(spend1, spend2);
                if (result['Total actual payment'] < best_total_actual_payment) {
                    best_total_actual_payment = result['Total actual payment'];
                    best_split = [spend1, spend2];
                    best_details = result;
                }
            }

            return {
                'Best Spend 1': best_split[0],
                'Best Spend 2': best_split[1],
                'Minimum total actual payment': best_total_actual_payment,
                'Details': best_details
            };
        }

        function calculateDiscount() {
            const originalPrice = parseInt(document.getElementById('originalPrice').value);
            if (isNaN(originalPrice) || originalPrice <= 0) {
                alert('請輸入有效的正整數！');
                return;
            }

            const result = maximizeSavingsMinFinalSpending(originalPrice);
            let resultHtml = '<div class="mt-4 space-y-2">';
            resultHtml += `<p><strong>最佳第一筆消費額：</strong>${result['Best Spend 1']} 元</p>`;
            resultHtml += `<p><strong>最佳第二筆消費額：</strong>${result['Best Spend 2']} 元</p>`;
            resultHtml += `<p><strong>實際支付第一筆：</strong>${result['Details']['Actual payment 1']} 元</p>`;
            resultHtml += `<p><strong>實際支付第二筆：</strong>${result['Details']['Actual payment 2']} 元</p>`;
            resultHtml += `<p><strong>獲得500元折價券數量：</strong>${result['Details']['Voucher 500 count']} 張</p>`;
            resultHtml += `<p><strong>獲得300元折價券數量：</strong>${result['Details']['Voucher 300 count']} 張</p>`;
            resultHtml += `<p><strong>使用的300元折價券數量：</strong>${result['Details']['Vouchers 300 used']} 張</p>`;
            resultHtml += `<p><strong>總共實際支付：</strong>${result['Minimum total actual payment']} 元</p>`;
            resultHtml += `<p><strong>總共節省：</strong>${originalPrice - result['Minimum total actual payment']} 元</p>`;
            resultHtml += '</div>';
            document.getElementById('result').innerHTML = resultHtml;
        }
    </script>
</body>

</html>
